<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div.fixed {
            position: fixed;
            left: 210px;
            border: 12px solid goldenrod;
        }

        div.relative{
            position: relative;
            top: 250px;
            left: 40px;
            border: 40px solid blueviolet ;
        }

        div.absolute{
            position: absolute;
            bottom: 100px;
            left: 66px;
            border: 20px solid rgb(84, 126, 163);

        }
    </style>
</head>
<body>
   <div class="fixed">
    fixed one
   </div> 

   <div class="relative">
    
    this is relative

    <div class="absolute">
        this is absolute
    </div>
   </div>
</body>
</html>
